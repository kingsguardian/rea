
name: Sync Fork

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync upstream
        run: gh repo sync "$GITHUB_REPOSITORY" -b main
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
